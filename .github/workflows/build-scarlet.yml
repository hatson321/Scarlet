name: Build Scarlet JAR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'libdave-maven/**'
      - 'scripts/**'
      - 'BUILDING.md'
      - '.github/workflows/build-scarlet.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache workspace-local Maven repository
        uses: actions/cache@v4
        with:
          path: |
            .build-cache/maven
            .build-cache/vrchat-sdk
          key: ${{ runner.os }}-scarlet-maven-${{ hashFiles('**/pom.xml', 'scripts/BootstrapVrchatSdk.java') }}
          restore-keys: |
            ${{ runner.os }}-scarlet-maven-

      - name: Build and verify supported Linux packages
        run: sh scripts/linux/build-and-verify.sh

      - name: Upload Scarlet JAR
        uses: actions/upload-artifact@v4
        with:
          name: Scarlet-Desktop
          path: |
            target/scarlet-*.jar
            !target/scarlet-*-debug.jar
            target/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 30
