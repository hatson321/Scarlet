name: Build Scarlet JAR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'libdave-maven/**'
      - 'scripts/**'
      - 'BUILDING.md'
      - '.github/workflows/build-scarlet.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache workspace-local Maven repository
        uses: actions/cache@v4
        with:
          path: |
            .build-cache/maven
            .build-cache/vrchat-sdk
          key: ${{ runner.os }}-scarlet-maven-${{ hashFiles('**/pom.xml', 'scripts/BootstrapVrchatSdk.java') }}
          restore-keys: |
            ${{ runner.os }}-scarlet-maven-

      - name: Build and verify supported Linux packages
        run: sh scripts/linux/build-and-verify.sh

      - name: Select desktop release artifact
        id: desktop
        shell: bash
        run: |
          version=$(tr -d '\r\n' < scarlet.version)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(a|T)[0-9]+)?$ ]]
          jar="target/scarlet-$version.jar"
          test -f "$jar"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          (cd target && sha256sum "scarlet-$version.jar") > target/SHA256SUMS-desktop.txt

      - name: Upload Scarlet JAR
        uses: actions/upload-artifact@v4
        with:
          name: Scarlet-Desktop
          path: |
            ${{ steps.desktop.outputs.jar }}
            target/SHA256SUMS-desktop.txt
          if-no-files-found: error
          retention-days: 30
