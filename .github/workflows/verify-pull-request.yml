name: Verify pull request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Check out proposed merge
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Linux build and synthetic tests
        if: runner.os == 'Linux'
        run: sh scripts/linux/build-and-verify.sh
      - name: Verify Windows build and synthetic tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testDirectory = Join-Path $env:RUNNER_TEMP 'scarlet-regressions'
          New-Item -ItemType Directory -Path $testDirectory -Force | Out-Null
          ./scripts/windows/build-and-verify.ps1 -TestDirectory $testDirectory
