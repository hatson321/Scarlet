# Scarlet UI/Discord strings — English (base / fallback).
#
# HOW TO TRANSLATE (no rebuild needed):
#   1. Copy this file and rename it messages_<lang>.properties, where <lang> is the
#      2-letter language code (de = German, es = Spanish, id = Indonesian, fr = French,
#      ja = Japanese, pt = Portuguese, ...).
#   2. Translate the text to the RIGHT of each "=". Leave the keys (left side) unchanged.
#      You can delete any line you don't translate — it falls back to English.
#   3. Put the file in Scarlet's  lang/  folder (next to this template). Restart Scarlet.
#      It's picked up automatically and appears as an available language.
#
# NOTES:
#   - Save as UTF-8. Accents and umlauts (ä ö ü ñ) are fine; no \uXXXX escapes needed.
#   - Placeholders like {0}, {1} are filled in by Scarlet — keep them, and where a
#     message has placeholders, write a literal apostrophe as '' (two apostrophes).
#   - Keep moderation terms accurate; when unsure, leave the English so nothing misleads.

