ui.encryptPinPrompt=<html>Lege eine PIN zum Verschlüsseln dieses Pakets fest (erforderlich, mindestens 4 Zeichen).<br>Du brauchst dieselbe PIN zum Importieren. Eine verlorene PIN kann nicht wiederhergestellt werden.</html>
ui.removeDataWarning=<html><div style='width:390px'><b>Alle Scarlet-Daten und -Zugangsdaten von DIESEM Computer entfernen?</b><br><br>Dies löscht den Datenordner dieses Rechners (Einstellungen, beobachtete Listen, Discord-Konfiguration, Metadaten) und die gespeicherten Zugangsdaten (Bot-Token, VRChat-Anmeldung, 2FA-Geheimnis, Sitzungscookie).<br><br>Tu dies erst, nachdem du dein Paket auf dem neuen Computer importiert und geprüft hast, dass es funktioniert. Das kann nicht rückgängig gemacht werden.</div></html>
ui.importDataDesc=<html>Einstellungen, beobachtete Listen, Discord-Konfiguration, Metadaten, Cache-/Datendateien. Wenn keine Zugangsdaten ausgewählt sind, überspringt Scarlet die Zugangsdaten-Schlüsseldateien, damit die Anmeldungen dieses PCs nutzbar bleiben.</html>
ui.importCredDesc=<html>Discord-Bot-Token, VRChat-Benutzername/-Passwort, 2FA-Geheimnis, Sitzungscookies, alternative Zugangsdaten, Java-Preferences und <code>global-prefs.key</code>.</html>
ui.keepChannelMappings=Discord-Kanäle übernehmen
ui.keepChannelsDesc=<html>Das importierte Audit-/Log-Kanal-Routing beibehalten. Deaktivieren, wenn in einen <b>anderen</b> Discord-Server importiert wird, um neue Kanäle festzulegen.</html>
ui.vrchatRunningInvite=<html><body style='width: 360px'><i>VRChat läuft bereits — „Mich selbst in VRChat einladen“ sendet eine Einladung an dein VRChat-Konto, damit du beitreten kannst, ohne das Spiel neu zu starten.</i></body></html>
ui.getExactAvatarDataDesc=<html><body style='width: 380px'><b>Genaue Avatar-Daten abrufen</b><br>Füge diese Startoptionen in Steam zu VRChat hinzu oder starte VRChat über Hatson321/Scarlet Logger (das sie automatisch anwendet):</body></html>
ui.migrationDesc=<html>Scarlet auf einen anderen PC oder ein anderes Betriebssystem umziehen. <b>Export</b> bündelt deine Zugangsdaten, Bot-Konfiguration und Daten in eine Datei; <b>Import</b> lässt dich Daten/Konfiguration, sichere Zugangsdaten oder beides wählen, erstellt zuvor automatisch eine lokale Sicherung und beendet dann, damit du sauber neu starten kannst. Halte beide Dateien privat — sie enthalten deine Anmeldungen.</html>

