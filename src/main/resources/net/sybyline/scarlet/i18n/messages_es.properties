ui.getExactAvatarDataDesc=<html><body style='width: 380px'><b>Obtener datos exactos del avatar</b><br>Añade estas opciones de inicio a VRChat en Steam, o inicia VRChat mediante Hatson321/Scarlet Logger (que las aplica automáticamente):</body></html>
ui.migrationDesc=<html>Mueve Scarlet a otro equipo o sistema operativo. <b>Exportar</b> agrupa tus credenciales, configuración del bot y datos en un archivo; <b>Importar</b> te permite elegir datos/configuración, credenciales seguras o ambos, tras hacer una copia de seguridad local automática, y luego se cierra para que puedas iniciarlo de nuevo limpiamente. Mantén ambos archivos privados: contienen tus inicios de sesión.</html>

