ui.removeDataWarning=<html><div style='width:390px'><b>¿Eliminar todos los datos y credenciales de Scarlet de ESTE equipo?</b><br><br>Esto borra la carpeta de datos de este equipo (ajustes, listas vigiladas, configuración de Discord, metadatos) y elimina sus credenciales guardadas (token del bot, inicio de sesión de VRChat, secreto 2FA, cookie de sesión).<br><br>Hazlo solo después de haber importado tu paquete en el nuevo equipo y comprobado que funciona. Esto no se puede deshacer.</div></html>
