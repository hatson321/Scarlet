ui.removeDataWarning=<html><div style='width:390px'><b>Hapus semua data dan kredensial Scarlet dari komputer INI?</b><br><br>Ini menghapus folder data mesin ini (pengaturan, daftar pantauan, konfigurasi Discord, metadata) dan menghapus kredensial tersimpannya (token bot, info masuk VRChat, rahasia 2FA, cookie sesi).<br><br>Lakukan ini hanya setelah Anda mengimpor paket di komputer baru dan memastikannya berfungsi. Tindakan ini tidak dapat dibatalkan.</div></html>
ui.importDataDesc=<html>Pengaturan, daftar pantauan, konfigurasi Discord, metadata, berkas cache/data. Jika kredensial tidak dipilih, Scarlet melewati berkas kunci kredensial agar info masuk PC ini tetap dapat digunakan.</html>
ui.importCredDesc=<html>Token bot Discord, nama pengguna/kata sandi VRChat, rahasia 2FA, cookie sesi, kredensial alternatif, Java Preferences, dan <code>global-prefs.key</code>.</html>
ui.keepChannelMappings=Bawa serta channel Discord
ui.keepChannelsDesc=<html>Pertahankan perutean channel audit/log yang diimpor. Hapus centang saat mengimpor ke server Discord yang <b>berbeda</b> agar Anda dapat menetapkan channel baru.</html>
ui.vrchatRunningInvite=<html><body style='width: 360px'><i>VRChat sudah berjalan — "Undang saya di VRChat" mengirim undangan ke akun VRChat Anda agar Anda bisa bergabung tanpa menjalankan ulang game.</i></body></html>
ui.getExactAvatarDataDesc=<html><body style='width: 380px'><b>Dapatkan data avatar yang akurat</b><br>Tambahkan opsi peluncuran ini ke VRChat di Steam, atau jalankan VRChat melalui Hatson321/Scarlet Logger (yang menerapkannya otomatis):</body></html>
ui.migrationDesc=<html>Pindahkan Scarlet ke PC atau sistem operasi lain. <b>Ekspor</b> menggabungkan kredensial, konfigurasi bot, dan data Anda ke dalam satu berkas; <b>Impor</b> memungkinkan Anda memilih data/konfigurasi, kredensial aman, atau keduanya, setelah membuat cadangan lokal otomatis, lalu keluar agar Anda bisa memulainya lagi dengan bersih. Jaga kerahasiaan kedua berkas — keduanya berisi info masuk Anda.</html>

