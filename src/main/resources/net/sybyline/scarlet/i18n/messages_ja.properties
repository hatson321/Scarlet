ui.encryptPinPrompt=<html>このパッケージを暗号化するPINを設定してください（必須、4文字以上）。<br>インポートには同じPINが必要です。失ったPINは復元できません。</html>
ui.removeDataWarning=<html><div style='width:390px'><b>このコンピュータからすべてのScarletデータと認証情報を削除しますか？</b><br><br>このマシンのデータフォルダ（設定、監視リスト、Discord設定、メタデータ）を削除し、保存された認証情報（ボットトークン、VRChatログイン、2FAシークレット、セッションCookie）を消去します。<br><br>新しいコンピュータでパッケージをインポートし、動作を確認した後にのみ実行してください。これは元に戻せません。</div></html>
ui.importDataDesc=<html>設定、監視リスト、Discord設定、メタデータ、キャッシュ/データファイル。認証情報が選択されていない場合、Scarletは認証キーファイルをスキップするため、このPCのログインはそのまま使えます。</html>
ui.importCredDesc=<html>Discordボットトークン、VRChatのユーザー名/パスワード、2FAシークレット、セッションCookie、代替の認証情報、Java Preferences、および<code>global-prefs.key</code>。</html>
ui.vrchatRunningInvite=<html><body style='width: 360px'><i>VRChatはすでに実行中です — 「VRChatで自分を招待」を選ぶと、ゲームを再起動せずに参加できるよう、あなたのVRChatアカウントに招待を送ります。</i></body></html>
ui.getExactAvatarDataDesc=<html><body style='width: 380px'><b>正確なアバターデータを取得</b><br>これらの起動オプションをSteamのVRChatに追加するか、Hatson321/Scarlet Logger経由でVRChatを起動してください（自動的に適用されます）:</body></html>
ui.migrationDesc=<html>Scarletを別のPCやOSに移行します。<b>エクスポート</b>は認証情報、ボット設定、データを1つのファイルにまとめます。<b>インポート</b>では、自動でローカルバックアップを作成した後、データ/設定、認証情報、またはその両方を選んで取り込み、その後クリーンに再起動できるよう終了します。両方のファイルはログイン情報を含むため非公開に保ってください。</html>
