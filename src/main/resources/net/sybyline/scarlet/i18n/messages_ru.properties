ui.removeDataWarning=<html><div style='width:390px'><b>Удалить все данные и учётные данные Scarlet с ЭТОГО компьютера?</b><br><br>Это удалит папку данных этой машины (настройки, списки отслеживания, конфигурацию Discord, метаданные) и очистит сохранённые учётные данные (токен бота, вход VRChat, секрет 2FA, cookie сессии).<br><br>Делайте это только после того, как импортировали пакет на новом компьютере и убедились, что он работает. Отменить нельзя.</div></html>
ui.importDataDesc=<html>Настройки, списки отслеживания, конфигурация Discord, метаданные, файлы кэша/данных. Если учётные данные не выбраны, Scarlet пропускает файлы ключей, чтобы входы на этом ПК остались рабочими.</html>
ui.importCredDesc=<html>Токен Discord-бота, логин/пароль VRChat, секрет 2FA, cookie сессии, альтернативные учётные данные, Java Preferences и <code>global-prefs.key</code>.</html>
ui.keepChannelMappings=Перенести каналы Discord
ui.keepChannelsDesc=<html>Сохранить импортированную привязку каналов аудита/логов. Снимите флажок при импорте на <b>другой</b> сервер Discord, чтобы задать новые каналы.</html>
ui.vrchatRunningInvite=<html><body style='width: 360px'><i>VRChat уже запущен — «Пригласить себя в VRChat» отправляет приглашение на ваш аккаунт VRChat, чтобы войти без перезапуска игры.</i></body></html>
ui.getExactAvatarDataDesc=<html><body style='width: 380px'><b>Получить точные данные аватара</b><br>Добавьте эти параметры запуска в VRChat в Steam или запускайте VRChat через Hatson321/Scarlet Logger (который применяет их автоматически):</body></html>
ui.migrationDesc=<html>Перенос Scarlet на другой ПК или ОС. <b>Экспорт</b> упаковывает ваши учётные данные, конфигурацию бота и данные в один файл; <b>Импорт</b> позволяет выбрать данные/конфигурацию, защищённые учётные данные или всё сразу, создаёт автоматическую локальную резервную копию, затем закрывается для чистого перезапуска. Держите оба файла в тайне — в них ваши входы.</html>

